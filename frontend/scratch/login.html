<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container">
<div class="w-full max-w-md flex flex-col items-center">
<!-- Logo and Branding Anchor -->
<div class="mb-12 text-center">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary-container mb-6 shadow-sm">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="spa">spa</span>
</div>
<h1 class="text-4xl font-extrabold tracking-tight text-primary mb-2">GastoClaro</h1>
<p class="text-on-surface-variant font-medium">Clear minds, better finances.</p>
</div>
<!-- Login Form Container -->
<div class="w-full bg-surface-container-lowest p-8 md:p-10 rounded-xl shadow-[0_40px_80px_-20px_rgba(43,53,47,0.04)]">
<h2 class="text-2xl font-bold text-on-surface mb-8">Welcome back</h2>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-xl" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline-variant font-medium outline-none" id="email" placeholder="your@email.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-sm font-semibold text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-bold text-primary hover:opacity-80 transition-opacity" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-xl" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline-variant font-medium outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Login Button -->
<div class="pt-2">
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-dim text-on-primary font-bold text-lg rounded-full shadow-lg shadow-primary/10 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Social Login Divider -->
<div class="relative my-10 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<span class="relative bg-surface-container-lowest px-4 text-xs font-bold text-outline-variant uppercase tracking-widest">Or continue with</span>
</div>
<!-- Social Buttons Grid -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 bg-surface-container-low rounded-xl font-bold text-sm text-on-secondary-fixed-variant hover:bg-surface-container-high transition-colors">
<img alt="Google" class="w-5 h-5" data-alt="minimalist google logo icon on a clean white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeue4E3vZKhJXALAIrhh4_ozPGZirBFw_FUm711W5rH166dh1O0_tfiDpFYmEE9khAMmpu05JiOKJRkj5mUJ3Z7GkyZW4i1-mqdS4aMZlF2IpdTl5jVqINIghl8-JjpYf_QUJ7jvqIzbVjnV-1YRcOY4KZIRxwg_7f0-hauhvEAW-ggXR37C-rf77Tax_O5St8pKvk5Sv0NY9aAj4QGobvyYTamaNdbJ-4CjG-PBHFNMo1t5wxhICh7LppNhov9B_5QcRT00p8P04R"/>
<span>Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 bg-surface-container-low rounded-xl font-bold text-sm text-on-secondary-fixed-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="apple">ios</span>
<span>Apple</span>
</button>
</div>
</div>
<!-- Create Account Footer -->
<p class="mt-8 text-on-surface-variant font-medium">
            New to GastoClaro? 
            <a class="text-primary font-extrabold hover:underline underline-offset-4 ml-1" href="#">Create Account</a>
</p>
</div>
<!-- Background Decoration Elements -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/20 blur-[120px] rounded-full -z-10"></div>
<div class="fixed bottom-[-5%] right-[-5%] w-[30%] h-[30%] bg-tertiary-container/30 blur-[100px] rounded-full -z-10"></div>
<!-- Illustration Anchor (Asymmetric Editorial Style) -->
<div class="fixed bottom-12 left-12 hidden lg:block max-w-xs">
<div class="p-6 bg-surface-container-low/80 backdrop-blur-md rounded-xl space-y-4">
<div class="w-12 h-12 bg-primary/10 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="trending_up">trending_up</span>
</div>
<p class="text-sm font-semibold text-on-surface leading-relaxed">
                "Since using GastoClaro, I've saved 15% more every month without the stress."
            </p>

<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-dim">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="portrait of a smiling young professional woman in soft natural lighting with a blurred green park background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD007j09_70A5Do1-VJNFg2M1kYJsQsrsvI3ijlSFXVXQ5BEZBuvr35c2yTvcokr1IezH0Z8TULd28RAKPDbv28mE31iRKRKI3UFXLncOYvuXih5Yl1nBENkjo0GDlrXvtg16qEdHkABX9xE8p_QImYnYW86W2supwSu6QOQh0C0onocf-iBclaKCh-d2ry0XqWxTF9lrECELgRSVWwm8jfRmvhZ3vhGbzCEvhujre7IpEP4iD_E3vO7P3WDcFl7sdAmml_gGt0UleU"/>
</div>
<span class="text-xs font-bold text-on-surface-variant italic">Sarah M., Designer</span>
</div>
</div>
