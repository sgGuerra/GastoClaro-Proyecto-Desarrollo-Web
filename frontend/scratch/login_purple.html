<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-full text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary transition-all duration-200" placeholder="ejemplo@correo.com" type="email"/>
</div>
</div>

</div>
<div class="relative flex items-center">

</div>
</div>
